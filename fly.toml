app = "stopai-coin"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  STOPAI_DATA_DIR = "/data"
  PUBLIC_APP_URL = "https://stopai-coin.fly.dev"
  OPENROUTER_SITE_URL = "https://stopai-coin.fly.dev"
  OPENROUTER_APP_NAME = "STOPAI Telegram Bot"
  OPENROUTER_CHAT_MODEL = "openrouter/auto"
  OPENROUTER_SERVER_IMAGE_MODEL = "google/gemini-3.1-flash-image"
  OPENROUTER_VIDEO_MODEL = "google/veo-3.1-lite"
  ALLOWED_ORIGINS = "https://stopai-coin.fly.dev,https://brake-coin.github.io"
  STOPAI_REQUIRE_TELEGRAM = "false"
  TELEGRAM_REPLIES_ENABLED = "true"
  TELEGRAM_IMAGES_ENABLED = "true"
  TELEGRAM_VIDEOS_ENABLED = "true"
  TELEGRAM_HANDLER_TIMEOUT_MS = "720000"
  CHAT_HOURLY_CAP = "30"
  CHAT_DAILY_CAP = "200"
  CHAT_USER_HOURLY_CAP = "10"
  CHAT_USER_DAILY_CAP = "50"
  IMAGE_HOURLY_CAP = "2"
  IMAGE_DAILY_CAP = "10"
  IMAGE_USER_HOURLY_CAP = "1"
  IMAGE_USER_DAILY_CAP = "3"
  VIDEO_HOURLY_CAP = "1"
  VIDEO_DAILY_CAP = "2"
  VIDEO_USER_HOURLY_CAP = "1"
  VIDEO_USER_DAILY_CAP = "1"
  MEDIA_DAILY_SPEND_CAP_USD = "5"
  VIDEO_DURATION_SECONDS = "4"
  VIDEO_RESOLUTION = "720p"
  VIDEO_ASPECT_RATIO = "1:1"
  X_AUTONOMOUS_POSTING_ENABLED = "true"
  X_AUTONOMOUS_INTERVAL_MINUTES = "480"
  X_AUTONOMOUS_START_DELAY_MINUTES = "60"
  X_AUTONOMOUS_HOURLY_CAP = "3"
  X_AUTONOMOUS_DAILY_CAP = "3"
  X_AUTONOMOUS_TYPES = "text,image,video"

[[mounts]]
  source = "stopai_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 7

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
