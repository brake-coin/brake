app = "brake-coin-memes"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  BRAKE_DATA_DIR = "/data"
  PUBLIC_APP_URL = "https://brake-coin-memes.fly.dev"
  OPENROUTER_SITE_URL = "https://brake-coin-memes.fly.dev"
  OPENROUTER_APP_NAME = "STOPAI Meme Generator"
  OPENROUTER_IMAGE_MODEL = "google/gemini-3.1-flash-image"
  ALLOWED_ORIGINS = "https://brake-coin-memes.fly.dev,https://brake-coin.github.io"
  MEME_RATE_LIMIT = "3"
  MEME_RATE_WINDOW_MS = "600000"
  MEME_MAX_CONCURRENT = "2"

[mounts]
  source = "brake_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 7

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
